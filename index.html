<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Flashcard Coach (Unofficial)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a202c; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 500px; padding: 20px; text-align: center; }
        header h1 { color: #0078d4; margin-bottom: 5px; }
        header p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .progress-bar { background: #e2e8f0; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; color: #4a5568; }
        .flashcard-container { perspective: 1000px; cursor: pointer; margin-bottom: 30px; height: 300px; }
        .flashcard { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .flashcard-container.flipped .flashcard { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; }
        .card-front { background: #ffffff; border: 2px solid #0078d4; }
        .card-back { background: #0078d4; color: white; transform: rotateY(180deg); }
        .card-face p { font-size: 1.2rem; font-weight: 500; line-height: 1.4; margin-bottom: 15px; }
        .card-face small { position: absolute; bottom: 20px; opacity: 0.6; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
        button { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:disabled { background: #cbd5e0; cursor: not-allowed; }
        #prev-btn, #next-btn { background: #0078d4; color: white; }
        #shuffle-btn { background: #ecc94b; color: #1a202c; }
        footer { font-size: 12px; color: #718096; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Azure Flashcard Coach</h1>
            <p>Unofficial Study Tool</p>
        </header>
        <div class="progress-bar">
            <span id="progress-text">Card 1 of 5</span>
        </div>
        <div class="flashcard-container" id="flashcard">
            <div class="flashcard">
                <div class="card-face card-front">
                    <p id="question-text">Question goes here</p>
                    <small>Click to flip</small>
                </div>
                <div class="card-face card-back">
                    <p id="answer-text">Answer goes here</p>
                    <small>Click to flip back</small>
                </div>
            </div>
        </div>
        <div class="controls">
            <button id="prev-btn" disabled>Previous</button>
            <button id="shuffle-btn">Shuffle</button>
            <button id="next-btn">Next</button>
        </div>
        <footer>
            <p>Built for the Azure Exam Prep Hackathon. Not affiliated with Microsoft.</p>
        </footer>
    </div>

    <script>
        const flashcards = [
            { question: "What is the primary purpose of Azure Resource Manager (ARM)?", answer: "To deploy, manage, and monitor resources as a group." },
            { question: "Which Azure service is best for storing unstructured data like images?", answer: "Azure Blob Storage." },
            { question: "What does a Virtual Network (VNet) allow you to do?", answer: "Isolate and securely connect Azure resources." },
            { question: "What is the difference between vertical and horizontal scaling?", answer: "Vertical increases resources of a single machine; horizontal adds more machines." },
            { question: "What is Azure Active Directory (Entra ID) used for?", answer: "Identity and access management." }
        ];

        let currentIndex = 0;
        let isFlipped = false;

        const flashcardContainer = document.querySelector("#flashcard");
        const questionText = document.querySelector("#question-text");
        const answerText = document.querySelector("#answer-text");
        const progressText = document.querySelector("#progress-text");
        const prevBtn = document.querySelector("#prev-btn");
        const nextBtn = document.querySelector("#next-btn");
        const shuffleBtn = document.querySelector("#shuffle-btn");

        function renderCard() {
            const currentCard = flashcards[currentIndex];
            questionText.textContent = currentCard.question;
            answerText.textContent = currentCard.answer;
            progressText.textContent = `Card ${currentIndex + 1} of ${flashcards.length}`;
            isFlipped = false;
            flashcardContainer.classList.remove("flipped");
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === flashcards.length - 1;
        }

        flashcardContainer.addEventListener("click", () => {
            isFlipped = !isFlipped;
            flashcardContainer.classList.toggle("flipped");
        });

        nextBtn.addEventListener("click", () => {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                renderCard();
            }
        });

        prevBtn.addEventListener("click", () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        });

        shuffleBtn.addEventListener("click", () => {
            for (let i = flashcards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
            }
            currentIndex = 0;
            renderCard();
        });

        renderCard();
    </script>
</body>
</html>
